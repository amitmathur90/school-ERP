org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin's incremental compiler crashes computing a relative path when the
# project and the Gradle/pub caches live on different Windows drive letters
# ("this and base files have different roots") — disabling incremental
# compilation avoids that code path entirely. Harmless (just a bit slower)
# for anyone building from the same drive as their caches.
kotlin.incremental=false
